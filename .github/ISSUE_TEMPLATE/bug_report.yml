name: Bug report
description: Report a reproducible firmware or build problem
body:
  - type: markdown
    attributes:
      value: Do not include Wi-Fi credentials, receiver tokens, MQTT credentials, or recordings.
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: Git tag or commit, if known
    validations:
      required: false
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: ESP32-C6 board model
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include relevant redacted logs and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
