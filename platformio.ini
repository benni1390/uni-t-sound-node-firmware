[env:esp32c6]
; pioarduino provides Arduino core 3.x, which is required for the ESP32-C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Serial uses UART0, which the board's USB-UART bridge exposes.
lib_deps =
    ; renovate: datasource=github-releases depName=h2zero/NimBLE-Arduino
    h2zero/NimBLE-Arduino@2.5.1
    ; renovate: datasource=github-releases depName=knolleary/PubSubClient
    knolleary/PubSubClient@2.8
    ; renovate: datasource=github-releases depName=Links2004/arduinoWebSockets
    links2004/WebSockets@2.6.1
